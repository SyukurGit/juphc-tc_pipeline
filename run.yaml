# PipelineRun that executes tax-calculator-pipeline.
#
# Covers apiVersion, kind, spec, params, and workspaces.
apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  name: tax-calculator-run
  labels:
    app.kubernetes.io/part-of: tax-calculator
spec:
  pipelineRef:
    name: tax-calculator-pipeline
  taskRunTemplate:
    serviceAccountName: tax-calculator-pipeline
  timeouts:
    pipeline: 25m
  params:
    - name: repo-url
      value: https://github.com/SyukurGit/tax-calculator.git
    - name: revision
      value: main
    - name: image-url
      value: us.icr.io/tax-calculator-ns/tax-calculator:latest
  workspaces:
    - name: source
      volumeClaimTemplate:
        spec:
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 1Gi
